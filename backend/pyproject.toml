[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "avsbharat", email = "avsbharat@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "uvicorn>=0.54.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
